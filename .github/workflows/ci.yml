name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pse
          POSTGRES_PASSWORD: pse
          POSTGRES_DB: pse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pse -d pse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgres://pse:pse@localhost:5432/pse_test
      DATABASE_URL: postgres://pse:pse@localhost:5432/pse_test
      SESSION_SECRET: ci-secret-not-used-outside-ci-0000000000
      WEB_ORIGIN: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
